name: darrenai-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install fastapi "uvicorn[standard]" pydantic pydantic-settings httpx pytest
      - run: cd backend && DARREN_DETECTOR_ENGINE=stub pytest -q
